<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus Analytics — Enterprise Analytics Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --color-primary-50:  #EFF6FF;
  --color-primary-100: #DBEAFE;
  --color-primary-500: #3B82F6;
  --color-primary-600: #2563EB;
  --color-primary-700: #1D4ED8;
  --color-success-50:  #ECFDF5;
  --color-success-500: #10B981;
  --color-success-700: #047857;
  --color-warning-50:  #FFFBEB;
  --color-warning-500: #F59E0B;
  --color-warning-700: #B45309;
  --color-danger-50:   #FEF2F2;
  --color-danger-500:  #EF4444;
  --color-danger-700:  #B91C1C;
  --color-gray-25:  #FCFCFD;
  --color-gray-50:  #F9FAFB;
  --color-gray-100: #F3F4F6;
  --color-gray-200: #E5E7EB;
  --color-gray-300: #D1D5DB;
  --color-gray-400: #9CA3AF;
  --color-gray-500: #6B7280;
  --color-gray-600: #4B5563;
  --color-gray-700: #374151;
  --color-gray-800: #1F2937;
  --color-gray-900: #111827;
  --chart-1:  #3B82F6;
  --chart-2:  #10B981;
  --chart-3:  #F59E0B;
  --chart-4:  #EF4444;
  --chart-5:  #8B5CF6;
  --chart-6:  #06B6D4;
  --chart-7:  #EC4899;
  --chart-8:  #84CC16;
  --chart-9:  #F97316;
  --chart-10: #6366F1;
  --chart-11: #14B8A6;
  --chart-12: #A855F7;
  --chart-grid: #F3F4F6;
  --chart-axis: #9CA3AF;
  --surface-page: #F9FAFB;
  --surface-card: #FFFFFF;
  --surface-hover: #F9FAFB;
  --border-subtle: #F3F4F6;
  --border-default: #E5E7EB;
  --border-strong: #D1D5DB;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --space-12: 48px; --space-16: 64px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.06), 0 4px 6px rgba(0,0,0,0.03);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.08), 0 8px 10px rgba(0,0,0,0.04);
  --shadow-focus: 0 0 0 3px rgba(59,130,246,0.15);
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
  --radius-xl: 12px; --radius-full: 9999px;
  --sidebar-width: 280px;
  --sidebar-collapsed: 64px;
  --header-height: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 20px; color: var(--color-gray-900);
  background: var(--surface-page); min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-gray-300); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-gray-400); }

.app { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; transition: grid-template-columns 0.2s ease; }
.app.collapsed { grid-template-columns: var(--sidebar-collapsed) 1fr; }

/* SIDEBAR */
.sidebar { background: var(--surface-card); border-right: 1px solid var(--border-default); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow: hidden; z-index: 40; }
.sidebar-header { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); height: var(--header-height); border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
.sidebar-logo { width: 32px; height: 32px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 16px; flex-shrink: 0; box-shadow: var(--shadow-sm); }
.sidebar-brand { display: flex; flex-direction: column; white-space: nowrap; overflow: hidden; }
.sidebar-brand-name { font-size: 14px; font-weight: 700; color: var(--color-gray-900); }
.sidebar-brand-sub { font-size: 11px; color: var(--color-gray-500); font-weight: 500; letter-spacing: 0.02em; }
.sidebar-toggle { margin-left: auto; width: 28px; height: 28px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--color-gray-500); transition: all 0.15s; flex-shrink: 0; }
.sidebar-toggle:hover { background: var(--color-gray-100); color: var(--color-gray-700); }
.sidebar-toggle svg { transition: transform 0.2s; }
.app.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: var(--space-3) var(--space-2); }
.nav-section { margin-bottom: var(--space-1); }
.nav-section-header { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-gray-500); cursor: pointer; border-radius: var(--radius-md); transition: background 0.15s; user-select: none; white-space: nowrap; overflow: hidden; }
.nav-section-header:hover { background: var(--color-gray-50); }
.nav-section-header svg { flex-shrink: 0; transition: transform 0.2s; }
.nav-section.collapsed .nav-section-header svg { transform: rotate(-90deg); }
.nav-section-title { flex: 1; }
.nav-section-count { font-size: 10px; font-weight: 600; background: var(--color-gray-100); color: var(--color-gray-600); padding: 1px 6px; border-radius: var(--radius-full); }
.app.collapsed .nav-section-title, .app.collapsed .nav-section-count, .app.collapsed .sidebar-brand,
.app.collapsed .nav-item-label, .app.collapsed .nav-item-shortcut, .app.collapsed .nav-item-badge { display: none; }
.app.collapsed .nav-section-header { justify-content: center; padding: var(--space-2); }
.nav-section-items { padding-left: var(--space-3); overflow: hidden; transition: max-height 0.25s ease; }
.nav-section.collapsed .nav-section-items { max-height: 0 !important; }
.nav-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; color: var(--color-gray-600); transition: all 0.12s; cursor: pointer; white-space: nowrap; overflow: hidden; position: relative; margin-bottom: 1px; }
.nav-item:hover { background: var(--color-gray-50); color: var(--color-gray-900); }
.nav-item.active { background: var(--color-primary-50); color: var(--color-primary-700); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 2px; background: var(--color-primary-600); border-radius: 0 2px 2px 0; }
.nav-item-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.nav-item-shortcut { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--color-gray-400); background: var(--color-gray-50); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--color-gray-200); }
.nav-item-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-primary-500); flex-shrink: 0; }
.sidebar-footer { border-top: 1px solid var(--border-default); padding: var(--space-3) var(--space-2); flex-shrink: 0; }
.sidebar-footer-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; color: var(--color-gray-600); cursor: pointer; transition: all 0.12s; white-space: nowrap; overflow: hidden; }
.sidebar-footer-item:hover { background: var(--color-gray-50); color: var(--color-gray-900); }
.sidebar-footer-item svg { width: 16px; height: 16px; flex-shrink: 0; }

/* MAIN */
.main { min-width: 0; display: flex; flex-direction: column; }
.header { background: var(--surface-card); border-bottom: 1px solid var(--border-default); position: sticky; top: 0; z-index: 30; }
.header-inner { padding: var(--space-4) var(--space-6); max-width: 1600px; margin: 0 auto; width: 100%; }
.breadcrumb { display: flex; align-items: center; gap: var(--space-2); font-size: 12px; color: var(--color-gray-500); margin-bottom: var(--space-2); }
.breadcrumb a { color: var(--color-gray-500); transition: color 0.12s; cursor: pointer; }
.breadcrumb a:hover { color: var(--color-gray-700); }
.breadcrumb-sep { color: var(--color-gray-300); }
.breadcrumb-current { color: var(--color-gray-700); font-weight: 500; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
.header-title-group { min-width: 0; }
.header-title { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--color-gray-900); letter-spacing: -0.01em; margin-bottom: var(--space-1); }
.header-desc { font-size: 13px; color: var(--color-gray-500); line-height: 18px; }
.header-meta { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.header-updated { display: flex; align-items: center; gap: var(--space-2); font-size: 12px; color: var(--color-gray-500); padding: var(--space-1) var(--space-3); background: var(--color-gray-50); border-radius: var(--radius-full); border: 1px solid var(--border-subtle); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success-500); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.filter-chip { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; color: var(--color-gray-700); transition: all 0.12s; white-space: nowrap; }
.filter-chip:hover { border-color: var(--border-strong); background: var(--color-gray-50); }
.filter-chip.active { border-color: var(--color-primary-500); background: var(--color-primary-50); color: var(--color-primary-700); }
.filter-chip svg { width: 14px; height: 14px; color: var(--color-gray-400); }
.filter-chip.active svg { color: var(--color-primary-600); }
.search-box { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
.search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--color-gray-400); pointer-events: none; }
.search-box input { width: 100%; padding: var(--space-2) var(--space-3) var(--space-2) 32px; border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: 13px; background: var(--surface-card); color: var(--color-gray-900); transition: all 0.15s; }
.search-box input::placeholder { color: var(--color-gray-400); }
.search-box input:focus { outline: none; border-color: var(--color-primary-500); box-shadow: var(--shadow-focus); }
.filter-actions { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }
.btn { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; transition: all 0.12s; white-space: nowrap; border: 1px solid transparent; }
.btn svg { width: 14px; height: 14px; }
.btn-ghost { color: var(--color-gray-600); }
.btn-ghost:hover { background: var(--color-gray-100); color: var(--color-gray-900); }
.btn-secondary { background: var(--surface-card); border-color: var(--border-default); color: var(--color-gray-700); }
.btn-secondary:hover { background: var(--color-gray-50); border-color: var(--border-strong); }
.btn-primary { background: var(--color-primary-600); color: white; border-color: var(--color-primary-600); }
.btn-primary:hover { background: var(--color-primary-700); border-color: var(--color-primary-700); }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; }

.content { padding: var(--space-6); max-width: 1600px; margin: 0 auto; width: 100%; }
.section { margin-bottom: var(--space-8); }
.section-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
.section-title-group { display: flex; align-items: center; gap: var(--space-3); }
.section-title { font-size: 16px; font-weight: 600; color: var(--color-gray-900); letter-spacing: -0.01em; }
.section-subtitle { font-size: 12px; color: var(--color-gray-500); font-weight: 400; }
.section-actions { display: flex; align-items: center; gap: var(--space-2); }

.grid { display: grid; gap: var(--space-4); }
.grid-12 { grid-template-columns: repeat(12, 1fr); }
.grid-6 { grid-template-columns: repeat(6, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.col-2 { grid-column: span 2; } .col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; }
.col-6 { grid-column: span 6; } .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }

/* KPI */
.kpi { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-4); transition: all 0.15s; position: relative; overflow: hidden; }
.kpi:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.kpi-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
.kpi-label { display: flex; align-items: center; gap: var(--space-2); font-size: 12px; font-weight: 500; color: var(--color-gray-500); text-transform: uppercase; letter-spacing: 0.03em; }
.kpi-label-icon { width: 24px; height: 24px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--color-primary-50); color: var(--color-primary-600); flex-shrink: 0; }
.kpi-label-icon svg { width: 14px; height: 14px; }
.kpi-menu { width: 24px; height: 24px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--color-gray-400); transition: all 0.12s; flex-shrink: 0; opacity: 0; }
.kpi:hover .kpi-menu { opacity: 1; }
.kpi-menu:hover { background: var(--color-gray-100); color: var(--color-gray-700); }
.kpi-menu svg { width: 14px; height: 14px; }
.kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; line-height: 36px; font-weight: 700; color: var(--color-gray-900); letter-spacing: -0.02em; margin-bottom: var(--space-1); }
.kpi-value-sm { font-size: 22px; line-height: 30px; }
.kpi-trend { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 12px; font-weight: 600; margin-bottom: var(--space-2); }
.kpi-trend.up { color: var(--color-success-700); }
.kpi-trend.down { color: var(--color-danger-700); }
.kpi-trend.flat { color: var(--color-gray-500); }
.kpi-trend svg { width: 12px; height: 12px; }
.kpi-trend-context { color: var(--color-gray-400); font-weight: 400; margin-left: var(--space-1); }
.kpi-footer { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--color-gray-500); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
.kpi-footer-link { display: inline-flex; align-items: center; gap: 4px; color: var(--color-primary-600); font-weight: 500; font-size: 12px; transition: color 0.12s; cursor: pointer; }
.kpi-footer-link:hover { color: var(--color-primary-700); }
.kpi-footer-link svg { width: 12px; height: 12px; }
.kpi-sparkline { height: 32px; margin: var(--space-2) 0; }
.kpi-progress { height: 6px; background: var(--color-gray-100); border-radius: var(--radius-full); overflow: hidden; margin: var(--space-2) 0; }
.kpi-progress-bar { height: 100%; border-radius: var(--radius-full); background: var(--color-primary-500); transition: width 0.6s ease; }
.kpi-progress-bar.success { background: var(--color-success-500); }
.kpi-progress-bar.warning { background: var(--color-warning-500); }
.kpi-progress-bar.danger { background: var(--color-danger-500); }
.kpi-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.kpi-badge.success { background: var(--color-success-50); color: var(--color-success-700); }
.kpi-badge.warning { background: var(--color-warning-50); color: var(--color-warning-700); }
.kpi-badge.danger { background: var(--color-danger-50); color: var(--color-danger-700); }
.kpi-badge.info { background: var(--color-primary-50); color: var(--color-primary-700); }
.kpi-breakdown { display: flex; gap: var(--space-3); margin-top: var(--space-2); }
.kpi-breakdown-item { display: flex; flex-direction: column; gap: 2px; }
.kpi-breakdown-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-gray-400); font-weight: 600; }
.kpi-breakdown-value { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--color-gray-700); }
.kpi-rank { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: var(--radius-md); font-size: 11px; font-weight: 700; background: var(--color-gray-100); color: var(--color-gray-600); }
.kpi-rank.gold { background: #FEF3C7; color: #B45309; }
.kpi-rank.silver { background: #F1F5F9; color: #475569; }
.kpi-rank.bronze { background: #FEF3C7; color: #92400E; }
.kpi-skeleton .skel { background: linear-gradient(90deg, var(--color-gray-100) 25%, var(--color-gray-200) 50%, var(--color-gray-100) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-sm); }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-line { height: 12px; margin-bottom: var(--space-2); }
.skel-line.w-40 { width: 40%; } .skel-line.w-60 { width: 60%; } .skel-line.w-80 { width: 80%; }
.skel-value { height: 28px; width: 50%; margin: var(--space-2) 0; }
.kpi-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); text-align: center; }
.kpi-empty-icon { width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-gray-100); display: flex; align-items: center; justify-content: center; color: var(--color-gray-400); margin-bottom: var(--space-3); }
.kpi-empty-icon svg { width: 20px; height: 20px; }
.kpi-empty-title { font-size: 13px; font-weight: 600; color: var(--color-gray-700); margin-bottom: 2px; }
.kpi-empty-desc { font-size: 12px; color: var(--color-gray-500); }

/* CHART CARD */
.chart-card { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; transition: all 0.15s; display: flex; flex-direction: column; }
.chart-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.chart-card-header { padding: var(--space-4) var(--space-4) var(--space-3); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.chart-card-title-group { min-width: 0; flex: 1; }
.chart-card-title { font-size: 14px; font-weight: 600; color: var(--color-gray-900); margin-bottom: 2px; letter-spacing: -0.005em; }
.chart-card-subtitle { font-size: 12px; color: var(--color-gray-500); line-height: 16px; }
.chart-card-actions { display: flex; align-items: center; gap: var(--space-1); flex-shrink: 0; }
.chart-card-action { width: 28px; height: 28px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--color-gray-400); transition: all 0.12s; }
.chart-card-action:hover { background: var(--color-gray-100); color: var(--color-gray-700); }
.chart-card-action svg { width: 14px; height: 14px; }
.chart-card-body { padding: 0 var(--space-4) var(--space-4); flex: 1; position: relative; }
.chart-card-footer { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); font-size: 12px; color: var(--color-gray-500); background: var(--color-gray-25); }
.chart-insight { display: flex; align-items: flex-start; gap: var(--space-2); color: var(--color-gray-600); font-size: 12px; line-height: 16px; }
.chart-insight svg { width: 14px; height: 14px; color: var(--color-primary-500); flex-shrink: 0; margin-top: 1px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: var(--space-3); padding: var(--space-2) 0; }
.legend-item { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 12px; color: var(--color-gray-600); cursor: pointer; transition: opacity 0.12s; }
.legend-item:hover { opacity: 0.8; }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* ============================================================
   SIDEBAR RENDER
   ============================================================ */
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = '';
  navData.forEach((section, idx) => {
    html += `<div class="nav-section" data-section="${idx}">`;
    html += `<div class="nav-section-header" onclick="toggleSection(${idx})">${chevron}<span class="nav-section-title">${section.label}</span><span class="nav-section-count">${section.items.length}</span></div>`;
    html += `<div class="nav-section-items" style="max-height:${section.items.length * 34}px;">`;
    section.items.forEach(item => {
      html += `<div class="nav-item" data-page="${item.id}" onclick="navigate('${item.id}')">
        <span class="nav-item-label">${item.label}</span>
        ${item.shortcut ? `<span class="nav-item-shortcut">${item.shortcut}</span>` : ''}
      </div>`;
    });
    html += `</div></div>`;
  });
  nav.innerHTML = html;
}
function toggleSection(idx) {
  document.querySelector(`.nav-section[data-section="${idx}"]`).classList.toggle('collapsed');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function navigate(pageId) {
  currentPage = pageId;
  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === pageId);
  });
  // Update header
  const [title, desc] = pageTitles[pageId] || ['Analytics', ''];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageDesc').textContent = desc;
  // Breadcrumb
  let sectionLabel = 'Analytics';
  navData.forEach(s => { if (s.items.find(i => i.id === pageId)) sectionLabel = s.label; });
  document.getElementById('breadcrumb').innerHTML = `
    <a onclick="navigate('overview')">Analytics</a>
    <span class="breadcrumb-sep">/</span>
    <a>${sectionLabel}</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">${title}</span>`;
  // Render content
  const content = document.getElementById('content');
  const renderer = pageRenderers[pageId] || pageRenderers['default'];
  content.innerHTML = renderer();
  window.scrollTo(0, 0);
  setTimeout(renderHeatmaps, 0);
}

   ============================================================ */
function lineChart({width=720, height=260, series=[], labels=[], yMax=400, yTicks=4}) {
  const padding = {top:20, right:20, bottom:40, left:40};
  const w = width - padding.left - padding.right;
  const h = height - padding.top - padding.bottom;
  const n = labels.length;
  const step = n > 1 ? w / (n-1) : 0;
  let svg = `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="height:${height}px;">`;
  // Grid
  for (let i=0;i<=yTicks;i++) {
    const y = padding.top + (h/yTicks)*i;
    svg += `<line class="chart-grid-line" x1="${padding.left}" y1="${y}" x2="${width-padding.right}" y2="${y}"/>`;
    svg += `<text class="chart-axis-label" x="${padding.left-8}" y="${y+4}" text-anchor="end">${Math.round(yMax - (yMax/yTicks)*i)}</text>`;
  }
  svg += `<line class="chart-axis-line" x1="${padding.left}" y1="${padding.top+h}" x2="${width-padding.right}" y2="${padding.top+h}"/>`;
  // X labels
  labels.forEach((l,i) => {
    svg += `<text class="chart-axis-label" x="${padding.left + step*i}" y="${height-15}" text-anchor="middle">${l}</text>`;
  });
  // Series
  series.forEach(s => {
    const pts = s.data.map((v,i) => `${padding.left + step*i},${padding.top + h - (v/yMax)*h}`).join(' L');
    svg += `<path d="M${pts}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.5}" stroke-linecap="round" stroke-linejoin="round" ${s.dashed?'stroke-dasharray="6 4"':''}/>`;
    // Last dot
    const last = s.data[s.data.length-1];
    svg += `<circle cx="${padding.left + step*(n-1)}" cy="${padding.top + h - (last/yMax)*h}" r="4" fill="${s.color}" stroke="white" stroke-width="2"/>`;
  });
  svg += '</svg>';
  return svg;
}

function areaChart({width=720, height=260, series=[], labels=[], yMax=400, yTicks=4, stacked=false}) {
  const padding = {top:20, right:20, bottom:40, left:40};
  const w = width - padding.left - padding.right;
  const h = height - padding.top - padding.bottom;
  const n = labels.length;
  const step = n > 1 ? w / (n-1) : 0;
  let svg = `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="height:${height}px;">`;
  for (let i=0;i<=yTicks;i++) {
    const y = padding.top + (h/yTicks)*i;
    svg += `<line class="chart-grid-line" x1="${padding.left}" y1="${y}" x2="${width-padding.right}" y2="${y}"/>`;
    svg += `<text class="chart-axis-label" x="${padding.left-8}" y="${y+4}" text-anchor="end">${Math.round(yMax - (yMax/yTicks)*i)}</text>`;
  }
  labels.forEach((l,i) => {
    svg += `<text class="chart-axis-label" x="${padding.left + step*i}" y="${height-15}" text-anchor="middle">${l}</text>`;
  });
  series.forEach(s => {
    const gradId = 'g' + Math.random().toString(36).slice(2,8);
    const pts = s.data.map((v,i) => `${padding.left + step*i},${padding.top + h - (v/yMax)*h}`).join(' L');
    svg += `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>`;
    svg += `<path d="M${pts} L${padding.left + step*(n-1)},${padding.top+h} L${padding.left},${padding.top+h} Z" fill="url(#${gradId})"/>`;
    svg += `<path d="M${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  svg += '</svg>';
  return svg;
}

function barChart({width=720, height=260, series=[], labels=[], yMax=400, yTicks=4, horizontal=false}) {
  const padding = {top:20, right:20, bottom:40, left:40};
  const w = width - padding.left - padding.right;
  const h = height - padding.top - padding.bottom;
  const n = labels.length;
  const groupW = w / n;
  const barW = groupW * 0.6 / series.length;
  let svg = `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="height:${height}px;">`;
  for (let i=0;i<=yTicks;i++) {
    const y = padding.top + (h/yTicks)*i;
    svg += `<line class="chart-grid-line" x1="${padding.left}" y1="${y}" x2="${width-padding.right}" y2="${y}"/>`;
    svg += `<text class="chart-axis-label" x="${padding.left-8}" y="${y+4}" text-anchor="end">${Math.round(yMax - (yMax/yTicks)*i)}</text>`;
  }
  labels.forEach((l,i) => {
    svg += `<text class="chart-axis-label" x="${padding.left + groupW*i + groupW/2}" y="${height-15}" text-anchor="middle">${l}</text>`;
  });
  series.forEach((s,si) => {
    s.data.forEach((v,i) => {
      const x = padding.left + groupW*i + (groupW - barW*series.length)/2 + barW*si;
      const bh = (v/yMax)*h;
      svg += `<rect x="${x}" y="${padding.top+h-bh}" width="${barW-2}" height="${bh}" rx="2" fill="${s.color}"/>`;
    });
  });
  svg += '</svg>';
  return svg;
}

function stackedBarChart({width=720, height=260, stacks=[], labels=[], yMax=400, yTicks=4}) {
  const padding = {top:20, right:20, bottom:40, left:40};
  const w = width - padding.left - padding.right;
  const h = height - padding.top - padding.bottom;
  const n = labels.length;
  const groupW = w / n;
  const barW = groupW * 0.6;
  let svg = `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="height:${height}px;">`;
  for (let i=0;i<=yTicks;i++) {
    const y = padding.top + (h/yTicks)*i;
    svg += `<line class="chart-grid-line" x1="${padding.left}" y1="${y}" x2="${width-padding.right}" y2="${y}"/>`;
    svg += `<text class="chart-axis-label" x="${padding.left-8}" y="${y+4}" text-anchor="end">${Math.round(yMax - (yMax/yTicks)*i)}</text>`;
  }
  labels.forEach((l,i) => {
    svg += `<text class="chart-axis-label" x="${padding.left + groupW*i + groupW/2}" y="${height-15}" text-anchor="middle">${l}</text>`;
  });
  labels.forEach((l,i) => {
    let yBase = padding.top + h;
    stacks.forEach(st => {
      const v = st.data[i];
      const bh = (v/yMax)*h;
      yBase -= bh;
      svg += `<rect x="${padding.left + groupW*i + (groupW-barW)/2}" y="${yBase}" width="${barW}" height="${bh}" fill="${st.color}"/>`;
    });
  });
  svg += '</svg>';
  return svg;
}

function donutChart({size=160, segments=[], total=100, label='Total'}) {
  const r = 60, cx = 80, cy = 80, circ = 2*Math.PI*r;
  let svg = `<svg viewBox="0 0 160 160" style="width:${size}px;height:${size}px;">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F3F4F6" stroke-width="20"/>`;
  let offset = 0;
  segments.forEach(s => {
    const dash = (s.value/total)*circ;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  svg += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#111827">${total.toLocaleString()}</text>`;
  svg += `<text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="Inter" font-size="11" fill="#6B7280" font-weight="500">${label}</text>`;
  svg += '</svg>';
  return svg;
}

function pieChart({size=160, segments=[], total=100}) {
  const r = 60, cx = 80, cy = 80, circ = 2*Math.PI*r;
  let svg = `<svg viewBox="0 0 160 160" style="width:${size}px;height:${size}px;">`;
  let offset = 0;
  segments.forEach(s => {
    const dash = (s.value/total)*circ;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="60" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  svg += '</svg>';
  return svg;
}

function gaugeChart({value=73, size=140, label='Score', color='#3B82F6'}) {
  const r = 55, cx = 70, cy = 70;
  const startAngle = Math.PI;
  const angle = startAngle - (value/100)*Math.PI;
  const x2 = cx + r*Math.cos(angle);
  const y2 = cy + r*Math.sin(angle);
  const largeArc = value > 50 ? 1 : 0;
  return `<svg viewBox="0 0 140 90" style="width:${size}px;height:${size*0.64}px;">
    <path d="M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy}" fill="none" stroke="#F3F4F6" stroke-width="12" stroke-linecap="round"/>
    <path d="M${cx-r},${cy} A${r},${r} 0 ${largeArc} 1 ${x2},${y2}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"/>
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#111827">${value}%</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" font-family="Inter" font-size="10" fill="#6B7280" font-weight="500">${label}</text>
  </svg>`;
}

function radialChart({size=160, segments=[], total=100}) {
  const cx = 80, cy = 80, r = 55;
  let svg = `<svg viewBox="0 0 160 160" style="width:${size}px;height:${size}px;">`;
  const n = segments.length;
  segments.forEach((s, i) => {
    const angle = (s.value/total) * Math.PI * 2;
    const startA = (i/n) * Math.PI * 2 - Math.PI/2;
    const endA = startA + angle;
    const x1 = cx + r*Math.cos(startA);
    const y1 = cy + r*Math.sin(startA);
    const x2 = cx + r*Math.cos(endA);
    const y2 = cy + r*Math.sin(endA);
    const largeArc = angle > Math.PI ? 1 : 0;
    svg += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${s.color}" opacity="0.85"/>`;
  });
  svg += `<circle cx="${cx}" cy="${cy}" r="28" fill="white"/>`;
  svg += '</svg>';
  return svg;
}

function scatterPlot({width=500, height=260, points=[], xLabel='X', yLabel='Y'}) {
  const padding = {top:20, right:20, bottom:40, left:50};
  const w = width - padding.left - padding.right;
  const h = height - padding.top - padding.bottom;
  let svg = `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" style="height:${height}px;">`;
  for (let i=0;i<=4;i++) {
    const y = padding.top + (h/4)*i;
    svg += `<line class="chart-grid-line" x1="${padding.left}" y1="${y}" x2="${width-padding.right}" y2="${y}"/>`;
  }
  svg += `<line class="chart-axis-line" x1="${padding.left}" y1="${padding.top+h}" x2="${width-padding.right}" y2="${padding.top+h}"/>`;
  svg += `<line class="chart-axis-line" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${padding.top+h}"/>`;
  svg += `<text class="chart-axis-label" x="${width/2}" y="${height-10}" text-anchor="middle">${xLabel}</text>`;
  svg += `<text class="chart-axis-label" x="16" y="${height/2}" text-anchor="middle" transform="rotate(-90 16 ${height/2})">${yLabel}</text>`;
  points.forEach(p => {
    const x = padding.left + p.x * w;
    const y = padding.top + h - p.y * h;
    svg += `<circle class="scatter-dot" cx="${x}" cy="${y}" r="${p.r||5}" fill="${p.color||'#3B82F6'}" opacity="0.7"/>`;
  });
  svg += '</svg>';
  return svg;
}

function bubbleChart({width=500, height=260, points=[]}) {
  return scatterPlot({width, height, points, xLabel:'Volume', yLabel:'Quality'});
}

function histogram({width=720, height=260, bins=[], labels=[]}) {
  const max = Math.max(...bins, 1);
  return barChart({width, height, series:[{color:'#3B82F6', data:bins}], labels, yMax:max*1.2, yTicks:4});
}

function paretoChart({width=720, height=260, bars=[], cumulative=[], labels=[]}) {
  const max = Math.max(...bars, 1);
  let svg = barChart({width, height, series:[{color:'#3B82F6', data:bars}], labels, yMax:max*1.2, yTicks:4});
  return svg;
}

function radarChart({size=200, axes=[], series=[]}) {
  const cx = 100, cy = 100, r = 70;
  const n = axes.length;
  let svg = `<svg viewBox="0 0 200 200" style="width:${size}px;height:${size}px;">`;
  // Grid rings
  for (let ring=1; ring<=4; ring++) {
    const rr = (r/4)*ring;
    const pts = axes.map((_,i) => {
      const a = (i/n)*Math.PI*2 - Math.PI/2;
      return `${cx + rr*Math.cos(a)},${cy + rr*Math.sin(a)}`;
    }).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#F3F4F6" stroke-width="1"/>`;
  }
  // Axes
  axes.forEach((a,i) => {
    const angle = (i/n)*Math.PI*2 - Math.PI/2;
    const x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E5E7EB" stroke-width="1"/>`;
    svg += `<text x="${cx + (r+15)*Math.cos(angle)}" y="${cy + (r+15)*Math.sin(angle)}" text-anchor="middle" font-family="Inter" font-size="9" fill="#6B7280" font-weight="600">${a}</text>`;
  });
  // Series
  series.forEach(s => {
    const pts = s.data.map((v,i) => {
      const angle = (i/n)*Math.PI*2 - Math.PI/2;
      const rr = (v/100)*r;
      return `${cx + rr*Math.cos(angle)},${cy + rr*Math.sin(angle)}`;
    }).join(' ');
    svg += `<polygon points="${pts}" fill="${s.color}" fill-opacity="0.15" stroke="${s.color}" stroke-width="2"/>`;
    s.data.forEach((v,i) => {
      const angle = (i/n)*Math.PI*2 - Math.PI/2;
      const rr = (v/100)*r;
      svg += `<circle cx="${cx + rr*Math.cos(angle)}" cy="${cy + rr*Math.sin(angle)}" r="3" fill="${s.color}"/>`;
    });
  });
  svg += '</svg>';
  return svg;
}

function funnelChart({steps=[], color='#3B82F6'}) {
  const max = steps[0]?.value || 1;
  return `<div class="funnel">${steps.map((s,i) => {
    const pct = (s.value/max)*100;
    const colors = ['#3B82F6','#6366F1','#8B5CF6','#06B6D4','#F59E0B','#10B981','#EF4444'];
    return `<div class="funnel-step">
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${pct}%;background:${colors[i%colors.length]};">${s.value.toLocaleString()}</div></div>
      <div class="funnel-value">${s.value.toLocaleString()}</div>
      <div class="funnel-pct">${s.pct || pct.toFixed(1)+'%'}</div>
    </div>`;
  }).join('')}</div>`;
}

function horizontalFunnel({steps=[]}) {
  const colors = ['#3B82F6','#6366F1','#8B5CF6','#06B6D4','#F59E0B','#10B981'];
  return `<div class="funnel-h">${steps.map((s,i) => `
    <div class="funnel-h-step">
      <div class="funnel-h-shape" style="background:${colors[i%colors.length]};">${s.value.toLocaleString()}</div>
      <div class="funnel-h-label">${s.label}</div>
    </div>
  `).join('')}</div>`;
}

function heatmapGrid({rows=7, cols=12, rowLabels=[], colLabels=[]}) {
  const palette = ['#EFF6FF','#DBEAFE','#93C5FD','#3B82F6','#1D4ED8'];
  let html = `<div class="heatmap" style="grid-template-columns:40px repeat(${cols}, 1fr);">`;
  html += `<div></div>`;
  colLabels.forEach(c => html += `<div style="font-size:10px;color:var(--color-gray-400);text-align:center;font-weight:600;">${c}</div>`);
  for (let r=0;r<rows;r++) {
    html += `<div style="font-size:10px;color:var(--color-gray-500);font-weight:600;display:flex;align-items:center;">${rowLabels[r]||''}</div>`;
    for (let c=0;c<cols;c++) {
      const intensity = Math.random();
      let color = palette[0];
      if (intensity > 0.8) color = palette[4];
      else if (intensity > 0.6) color = palette[3];
      else if (intensity > 0.4) color = palette[2];
      else if (intensity > 0.2) color = palette[1];
      html += `<div class="heatmap-cell" style="background:${color};" title="${rowLabels[r]||''} ${colLabels[c]||''}: ${Math.floor(intensity*50)}"></div>`;
    }
  }
  html += '</div>';
  html += `<div class="heatmap-legend"><span>Less</span><div class="heatmap-legend-scale">${palette.map(c=>`<div class="heatmap-legend-box" style="background:${c};"></div>`).join('')}</div><span>More</span></div>`;
  return html;
}

function cohortTable({rows=[], cols=['M0','M1','M2','M3','M4','M5']}) {
  let html = `<table class="cohort-table"><thead><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr><td>${r.label}</td>`;
    r.values.forEach((v,i) => {
      const intensity = v/100;
      let color = '#F3F4F6';
      if (v >= 80) color = '#1D4ED8';
      else if (v >= 60) color = '#3B82F6';
      else if (v >= 40) color = '#93C5FD';
      else if (v >= 20) color = '#DBEAFE';
      const textColor = v >= 60 ? 'white' : '#374151';
      html += `<td style="background:${color};color:${textColor};">${v}%</td>`;
    });
    html += `</tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function matrixTable({rows=[], cols=[], data=[]}) {
  let html = `<table class="matrix"><thead><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach((r,ri) => {
    html += `<tr><td>${r}</td>`;
    cols.forEach((c,ci) => {
      const v = data[ri]?.[ci] ?? 0;
      let bg = 'transparent';
      if (v >= 80) bg = '#ECFDF5';
      else if (v >= 50) bg = '#FFFBEB';
      else if (v > 0) bg = '#FEF2F2';
      html += `<td class="matrix-cell" style="background:${bg};">${v}%</td>`;
    });
    html += `</tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function sparkline({data=[], color='#3B82F6'}) {
  const max = Math.max(...data,1), min = Math.min(...data,0);
  const range = max-min || 1;
  const step = 200/(data.length-1);
  const pts = data.map((v,i) => `${i*step},${28 - ((v-min)/range)*24}`).join(' L');
  const gradId = 'sp' + Math.random().toString(36).slice(2,8);
  return `<svg class="chart-svg" viewBox="0 0 200 32" preserveAspectRatio="none">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="M${pts} L200,32 L0,32 Z" fill="url(#${gradId})"/>
    <path d="M${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function renderHeatmaps() {
  document.querySelectorAll('[data-heatmap]').forEach(el => {
    const type = el.dataset.heatmap;
    if (type === 'activity') {
      el.innerHTML = heatmapGrid({
        rows: 7, cols: 12,
        rowLabels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        colLabels: ['6a','7a','8a','9a','10a','11a','12p','1p','2p','3p','4p','5p']
      });
    } else if (type === 'cohort') {
      el.innerHTML = cohortTable({
        rows: [
          {label:'Jan 2026', values:[100,82,74,68,62,58]},
          {label:'Dec 2025', values:[100,79,71,65,60,55]},
          {label:'Nov 2025', values:[100,81,73,67,61,0]},
          {label:'Oct 2025', values:[100,78,70,64,0,0]},
          {label:'Sep 2025', values:[100,80,72,0,0,0]},
          {label:'Aug 2025', values:[100,77,0,0,0,0]}
        ]
      });
    }
  });
}
